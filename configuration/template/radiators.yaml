# Template switches for the radiator TRVs.
# Each switch is unavailable while its thermostat is unavailable, and uses
# float(0) so a missing temperature never raises a template error.
- switch:
    - name: Adams Radiator
      unique_id: bdfedd86-bc8f-4052-8407-ceea29ec17a0
      availability: "{{ has_value('climate.adams_radiator_becathermostat') }}"
      state: "{{ state_attr('climate.adams_radiator_becathermostat','temperature')|float(0) > 10 }}"
      turn_on:
        - action: climate.set_temperature
          data:
            temperature: 24
          target:
            entity_id: climate.adams_radiator_becathermostat
      turn_off:
        - action: climate.set_temperature
          data:
            temperature: 5
          target:
            entity_id: climate.adams_radiator_becathermostat
      icon: >-
        {% if state_attr('climate.adams_radiator_becathermostat','temperature')|float(0) > 10 %}
          mdi:radiator
        {% else %}
          mdi:radiator-off
        {% endif %}

