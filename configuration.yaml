                    },
                    "ON_PEAK": {
                      "periods": [
                        { "fromDayOfWeek": 0, "toDayOfWeek": 6, "fromHour": {{ start.hour }}, "fromMinute": {{ start.minute }}, "toHour": {{ end.hour }}, "toMinute": {{ end.minute }} }
                      ]
                    }
                  }
                }
              }
            }
          }
        }
      }

