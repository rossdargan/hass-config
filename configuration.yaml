command_line:
 - sensor:
     name: label_colors
     command: !secret todoist_cmd_with_api_token
     value_template: >
       {{ value_json.label_colors | length }}
     json_attributes:
       - label_colors
     scan_interval: 200
     
rest_command:
  jotty_get_notes:
    url: "https://jotty.internal.dargan.uk/api/notes"
    method: GET
    headers:
      x-api-key: !secret jotty_api_key
    timeout: 20
  todoist:
    method: post
    url: 'https://api.todoist.com/api/v1/{{ url }}'
    payload: '{{ payload }}'
    headers:
      Authorization: !secret todoist_api_token
    content_type: 'application/x-www-form-urlencoded'
  barcodevault_lookup:
    url: "https://barcode.internal.dargan.uk/api/lookup/{{ barcode }}"
    method: GET
    content_type: "application/json"
    headers:
      Authorization: !secret barcodevault_authorization
  barcodevault_create_product:
    url: "https://barcode.internal.dargan.uk/api/products"
    method: POST
    content_type: "application/json"
    headers:
      Authorization: !secret barcodevault_authorization
    payload: >-
      {
        "barcode": "{{ barcode }}",
        "name": "{{ name }}",
        "brand": "{{ brand | default('') }}",
        "category": "{{ category | default('') }}"
      }
  add_event:
    url: "https://frigate.dargan.uk/api/events/{{camera}}/{{event}}/create"
    method: post
    content_type: "application/json"
    payload: '{"duration": 30, "include_recording": true, "sub_label":"{{subLabel}}" }'  
  garden_event_door_open:
    url: "https://frigate.dargan.uk/api/events/garden/Door Opened/create"
    method: post
    content_type: "application/json"
    payload: '{"duration": 30, "include_recording": true }'
  fire_tv_notification:
    url: "http://{{ip}}:7979/notify"
    method: post
    content_type: "application/json"
    payload: '{ "duration": 30, "position": 0, "title": "{{title}}", "titleColor": "#0066cc", "titleSize": 20, "message": "{{message}}", "messageColor": "#000000", "messageSize": 14, "backgroundColor": "#ffffff", "media": { "{{media}}": { "uri": "{{mediauri}}", "width": 600 }} }'
  garden_event_door_unlocked:
    url: "https://frigate.dargan.uk/api/events/garden/Door Unlocked/create"
    method: post
    content_type: "application/json"
    payload: '{"duration": 30, "include_recording": true }'    
  push_position_to_dawarich:
    url: !secret dawarich_key
    method: POST
    content_type: 'application/json'
    payload: >
      {
        "locations": [
        {
         "type": "Feature",
         "geometry":{
           "type": "Point",
           "coordinates":[
             {{ longitude }},
             {{ latitude }}
            ]
         },
         "properties":{
            "api_key": "xxxxxxxxxxxxx",
            "timestamp": "{{ now().isoformat() }}",
            "altitude": {{ altitude }},
            "speed": {{ speed }},
            "horizontal_accuracy": 0,
            "vertical_accuracy": {{ vertical_accuracy }},
            "motion": [],
            "pauses": false,
            "activity": "{{ activity }}",
            "desired_accuracy": 0,
            "deferred": 0,
            "significant_change": "unknown",
            "locations_in_payload": 1,
            "device_id": "{{device_id}}",
            "wifi": "unknown",
            "battery_state": "unknown",
            "battery_level": {{ battery_level }}
         }
        }
        ]
      }
rest:
  - resource_template: "http://192.168.10.10:5007/v1/budgets/d643c983-37cd-44d0-bf68-be8f89a3cf81/months/{{ now().strftime('%Y-%m') }}/categories/4fa70e13-9445-4d50-8827-6e65dc956794"
    headers:
      x-api-key: !secret actual_api_key
    scan_interval: 3600
    sensor:
      - name: "Tesla Extra Miles Saved"
        unique_id: tesla_extra_miles_saved
        value_template: "{{ (value_json.data.balance | float(0)) / 100 }}"
        unit_of_measurement: "GBP"
        device_class: monetary
        
# http: removed - settings already migrated to the UI (Settings > System > Network).
# Repair "yaml_still_present_after_migration" (becomes an error in 2027.2).
 
light:
  - platform: switch
    name: Landing Light
    entity_id: switch.landing_light
  - platform: group
    name: Kitchen Lights
    entities:
      - light.kitchen_main_light
      - light.kitchen_outer_lights_on_off
    
recorder:  
  purge_keep_days: 10
  db_url: !secret maria_db
  exclude:
   entities:
    - sensor.house_energy_5624021b_smartenergy_metering
    - sensor.house_energy_5624021b_smartenergy_metering_summation_delivered
    - sensor.todoist_chores
    - sensor.cloud_gateway_fiber_memory_utilisation
    - sensor.cloud_gateway_fiber_cpu_utilisation
    - sensor.adams_pc_electric_consumption_a
    - sensor.adams_pc_electric_consumption_v
    - sensor.sonoff_s60zbtpg_voltage
    - sensor.bedroom_tv_voltage
    - sensor.office_speaker_voltage
    - script.1753524090189
    - sensor.ross_iphone_distance
   entity_globs:
    - sensor.*_uptime
    - sensor.*_wifi_signal*
    - sensor.*_rssi
    - sensor.*_last_seen
    - sensor.*_sound_level
tts:
  - platform: microsoft
    api_key: !secret microsoft_tts_key

twilio:
  account_sid: !secret twilio_account_sid
  auth_token: !secret twilio_auth_token
  

# influxdb: removed - already imported as a UI config entry
# ("homeassistant (http://192.168.86.51:8086)"), YAML support deprecated in 2026.9.
  

input_boolean:
  winter:
    name: Disable the greenhouse alerts in the winter
    icon: mdi:thermometer-chevron-down
    
input_number:
  kitchen_light_level:
    name: Kitchen light level
    min: 0
    max: 150
    step: 1    
    unit_of_measurement: 'lx'
  hall_light_level:
    name: Hall light level
    min: 0
    max: 150
    step: 1    
    unit_of_measurement: 'lx'    

input_text:
  alexa_actionable_notification:
    name: Alexa Actionable Notification Holder
    max: 255
    initial: '{"text": "This is a test of the alexa actions custom skill. Did it work?", "event": "actionable.skill.test"}'

shell_command:
  update_ha: "echo '/docker/homeassistant/up.sh' > cmdpipe"
  restart_ha: "echo 'docker restart home-assistant' > cmdpipe"
  pull_config: "echo '/docker/homeassistant/pull.sh' > cmdpipe"
  todays_timelapse: "echo '/docker/timelapse/today.sh' > cmdpipe"

    
zha:
  zigpy_config:
    ota:
      # Ledvance, Sonoff, Inovelli and Third Reality are built in now;
      # only providers that need opting into are listed here.
      extra_providers:
        - type: ikea
        - type: salus
